# LAN-only: deny any request for cliproxy.teknoir.cloud whose client IP is outside the LAN.
#
# It has to sit on the ingress gateway (istio-system), not on the cliproxy pod: by the time a
# request reaches the pod its source is the gateway, so only the gateway knows the client IP.
# `remoteIpBlocks` is the original client address (from X-Forwarded-For when the gateway has
# numTrustedProxies set, otherwise the downstream connection address).
#
# PRECONDITION (see README.md, "LAN filter"): the gateway must actually see the client IP. With
# the k3s ServiceLB (klipper) and externalTrafficPolicy: Cluster the source is rewritten to a
# node/svclb address, which would make this policy deny the LAN too, or allow everyone if that
# address happens to be inside the blocks below. Verify from the LAN and from outside before
# relying on it.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: cliproxyapi-lan-only
  namespace: istio-system
spec:
  selector:
    matchLabels:
      istio: ingressgateway
  action: DENY
  rules:
    - to:
        - operation:
            hosts:
              - cliproxy.teknoir.cloud
              - cliproxy.teknoir.cloud:*
      from:
        - source:
            notRemoteIpBlocks:
              - 192.168.2.0/24
