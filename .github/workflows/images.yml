name: images

# Builds and pushes ghcr.io/<owner>/cliproxyapi and ghcr.io/<owner>/t3code.
#   push to main      -> :main and :sha-<short>
#   tag v*            -> :<tag> (and semver forms)
#   pull request      -> build only, no push
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "docker/**"
      - "src/cliproxyapi"
      - ".github/workflows/images.yml"
  pull_request:
    paths:
      - "docker/**"
      - "src/cliproxyapi"
      - ".github/workflows/images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: cliproxyapi
            dockerfile: docker/cliproxyapi/Dockerfile
            context: src/cliproxyapi
            submodule: src/cliproxyapi
          - image: t3code
            dockerfile: docker/t3code/Dockerfile
            context: docker/t3code
            submodule: ""
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      # Only the submodule the image needs; src/t3code is large and not used by its image.
      - name: Check out submodule
        if: matrix.submodule != ''
        run: git submodule update --init --depth 1 "${{ matrix.submodule }}"

      - name: Build metadata
        id: src
        run: |
          if [ -n "${{ matrix.submodule }}" ]; then
            git -C "${{ matrix.submodule }}" fetch --tags --depth 50 --quiet || true
            echo "version=$(git -C '${{ matrix.submodule }}' describe --tags --always)" >> "$GITHUB_OUTPUT"
            echo "commit=$(git -C '${{ matrix.submodule }}' rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "commit=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.src.outputs.owner }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.src.outputs.version }}
            COMMIT=${{ steps.src.outputs.commit }}
            BUILD_DATE=${{ steps.src.outputs.date }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
