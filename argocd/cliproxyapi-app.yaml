# The Argo CD Application for the hub. Self-contained: it is NOT rendered by the gitops
# app-of-apps (teknoir/platform-applications-gitops) and does not follow its staging releases.
# Create it once with scripts/bootstrap-argocd.sh; from then on Argo CD syncs on its own.
#
# Source is the `deploy` branch, not main: .github/workflows/deploy-branch.yml publishes deploy/
# there (git subtree split) on every push to main that touches deploy/. main carries the
# src/* submodules, which Argo CD (submodules enabled) would check out recursively and fails on.
# So the path is `cliproxyapi`, the branch root being the contents of deploy/.
#
# The gitops release guard (ValidatingAdmissionPolicy staging-release-guard) denies hand-made
# CREATE/UPDATE/DELETE of Applications, so creating or changing THIS object needs break-glass on
# the teknoir-system Namespace (the bootstrap script does that and closes it again). Argo CD's own
# syncs are not affected: the application controller is an excluded identity.
#
# The root app-of-apps does not prune it: it only prunes the Applications it rendered itself.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cliproxyapi
  namespace: teknoir-system
  labels:
    app.kubernetes.io/part-of: t3-code
spec:
  project: teknoir-cloud
  destination:
    namespace: cliproxy
    server: https://kubernetes.default.svc
  source:
    repoURL: https://github.com/tekn0ir/t3-code
    path: cliproxyapi
    targetRevision: deploy
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
      enabled: true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
