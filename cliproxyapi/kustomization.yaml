apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# CLIProxyAPI on r415, synced by the self-contained Argo CD Application `cliproxyapi`
# (deploy/argocd/cliproxyapi-app.yaml, created by scripts/bootstrap-argocd.sh). The config
# Secret `cliproxyapi-config` is NOT part of this kustomization: apply it out-of-band from
# secret.example.yaml (see README.md).
# No top-level `namespace:`: the cliproxy-lan Service (gateway.yaml) selects the ingress gateway
# pods and must stay in istio-system, so each resource names its own namespace.

resources:
  - namespace.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - gateway.yaml
  - virtualservice.yaml

labels:
  - pairs:
      app.kubernetes.io/name: cliproxyapi
      app.kubernetes.io/part-of: t3-code
    includeSelectors: false

images:
  - name: cliproxyapi
    newName: ghcr.io/tekn0ir/cliproxyapi
    # Pin to a sha-<short> tag (or digest) from the images workflow once the first build is pushed.
    newTag: main
