# https://cliproxy.teknoir.cloud:8317 -> cliproxyapi:8317 (API, /management.html, Codex websockets).
# Bound ONLY to the LAN listener (gateway.yaml). Do not add istio-system/teknoir-gateway here:
# that is the internet-facing :443 listener.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: cliproxyapi
  namespace: cliproxy
spec:
  hosts:
    - cliproxy.teknoir.cloud
  gateways:
    - cliproxy/cliproxy-lan
  http:
    - name: cliproxyapi
      route:
        - destination:
            host: cliproxyapi.cliproxy.svc.cluster.local
            port:
              number: 8317
      # No `timeout`: Istio sets none by default, which long streaming completions and Codex
      # websocket sessions need (this Istio rejects an explicit 0s). Istio proxies the HTTP/1.1
      # websocket upgrade on every route by default.
