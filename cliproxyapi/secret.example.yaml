# TEMPLATE, not part of kustomization.yaml. Copy, fill in, apply out-of-band:
#
#   cp deploy/cliproxyapi/secret.example.yaml deploy/cliproxyapi/secret.yaml   # gitignored
#   # replace both CHANGE-ME values (e.g. `openssl rand -hex 32`)
#   kubectl --context r415 apply -f deploy/cliproxyapi/secret.yaml
#   kubectl --context r415 -n cliproxy rollout restart deploy/cliproxyapi
#
# Config follows Theo's guide: round-robin across accounts, 1h session affinity (keeps a
# conversation on one account for prompt-cache reuse), one client API key, a management secret.
# Full reference: src/cliproxyapi/config.example.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: cliproxyapi-config
  namespace: cliproxy
type: Opaque
stringData:
  config.yaml: |
    config-version: 8

    server:
      # Bind all interfaces: the Service reaches the pod on its pod IP.
      host: ""
      port: 8317
      # Forwarded client IPs are trusted only from the k3s pod network (the ingress gateway
      # pod). Add the node/LAN range only if the gateway sees the client through it.
      trusted-proxies:
        - 10.42.0.0/16

    management:
      # The dashboard is reached through the ingress gateway, which is "remote" to the pod.
      # LAN-only exposure is enforced by the Istio AuthorizationPolicy.
      allow-remote: true
      # Plaintext here; CLIProxyAPI hashes it in its writable copy on start.
      secret-key: "CHANGE-ME-management-secret"

    access:
      # Clients (Claude Code, Codex, T3 Code) send this as a bearer token / API key.
      api-keys:
        - "CHANGE-ME-client-api-key"

    routing:
      strategy: "round-robin"
      session-affinity: true
      session-affinity-ttl: "1h"
      session-affinity-subagents: true

    oauth:
      # PVC cliproxyapi-auths is mounted here.
      auth-dir: "/root/.cli-proxy-api"
